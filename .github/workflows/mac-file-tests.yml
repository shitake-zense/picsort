name: Test Mac file operations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple-Silicon
            runner: macos-15
          - arch: Intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test copy, move and trash with disposable fixtures
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p test_core.py -v
          python -m unittest discover -s tests -p test_photo_tools.py -v
          python -m unittest discover -s tests -p test_similar.py -v
          python -m unittest discover -s tests -p test_ui.py -k similar -v
          python -m unittest discover -s tests -p test_ui.py -k group_navigation -v
          python -m unittest discover -s tests -p test_ui.py -k splitter -v
          python -m unittest discover -s tests -p test_ui.py -k panes_are_adjustable -v
